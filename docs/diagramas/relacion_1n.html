<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  text { font-family: "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1460" height="640" viewBox="0 0 1460 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1460" height="640" fill="#ffffff"/>

  <text x="730" y="46" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#1f2a44">Relación uno a muchos: Género (1) → Videojuego (N)</text>
  <text x="730" y="76" text-anchor="middle" style="font-size:17px;fill:#4b5563">Un género agrupa muchos videojuegos y cada videojuego pertenece a un solo género</text>

  <!-- GENERO -->
  <rect x="70" y="170" width="430" height="300" rx="14" fill="#eef2ff" stroke="#3446a8" stroke-width="2.5"/>
  <rect x="70" y="170" width="430" height="56" rx="14" fill="#3446a8"/>
  <rect x="70" y="206" width="430" height="20" fill="#3446a8"/>
  <text x="94" y="207" style="font-size:23px;font-weight:700;fill:#ffffff">Genero  (entidad principal)</text>

  <text x="96" y="266" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Id</text>
  <rect x="150" y="249" width="48" height="24" rx="4" fill="#ffe9a8"/>
  <text x="159" y="267" style="font-size:15px;fill:#7a5a00">PK</text>
  <text x="220" y="266" style="font-size:16px;fill:#6b7280">int, identidad</text>

  <text x="96" y="312" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Nombre</text>
  <text x="220" y="312" style="font-size:16px;fill:#6b7280">varchar(60)</text>

  <text x="96" y="358" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Popular</text>
  <text x="220" y="358" style="font-size:16px;fill:#6b7280">bool</text>

  <text x="96" y="404" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Videojuegos</text>
  <rect x="266" y="386" width="62" height="24" rx="4" fill="#e6e9f5"/>
  <text x="276" y="404" style="font-size:15px;fill:#3b4a6b">nav</text>
  <text x="96" y="438" style="font-size:16px;fill:#6b7280">colección: ICollection&lt;Videojuego&gt;</text>

  <!-- VIDEOJUEGO -->
  <rect x="960" y="120" width="440" height="400" rx="14" fill="#f8fafc" stroke="#1f2a44" stroke-width="2.5"/>
  <rect x="960" y="120" width="440" height="56" rx="14" fill="#1f2a44"/>
  <rect x="960" y="156" width="440" height="20" fill="#1f2a44"/>
  <text x="984" y="157" style="font-size:23px;font-weight:700;fill:#ffffff">Videojuego  (entidad dependiente)</text>

  <text x="986" y="216" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Id</text>
  <rect x="1040" y="199" width="48" height="24" rx="4" fill="#ffe9a8"/>
  <text x="1049" y="217" style="font-size:15px;fill:#7a5a00">PK</text>

  <text x="986" y="262" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Titulo</text>
  <text x="986" y="308" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Precio</text>
  <text x="986" y="354" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Disponible</text>

  <text x="986" y="400" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">GeneroId</text>
  <rect x="1104" y="383" width="48" height="24" rx="4" fill="#d9f2e6"/>
  <text x="1113" y="401" style="font-size:15px;fill:#14532d">FK</text>
  <text x="1170" y="400" style="font-size:16px;fill:#6b7280">int NOT NULL</text>

  <text x="986" y="446" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Genero</text>
  <rect x="1082" y="429" width="62" height="24" rx="4" fill="#e6e9f5"/>
  <text x="1092" y="447" style="font-size:15px;fill:#3b4a6b">nav</text>
  <text x="986" y="486" style="font-size:16px;fill:#6b7280">referencia: Genero?</text>

  <!-- LINEA -->
  <path d="M 500 320 C 700 320, 760 320, 960 320" stroke="#3446a8" stroke-width="3" fill="none"/>
  <circle cx="500" cy="320" r="6" fill="#3446a8"/>
  <circle cx="960" cy="320" r="6" fill="#1f2a44"/>
  <text x="536" y="300" style="font-size:30px;font-weight:700;fill:#3446a8">1</text>
  <text x="908" y="300" style="font-size:30px;font-weight:700;fill:#1f2a44">N</text>
  <text x="730" y="306" text-anchor="middle" style="font-size:17px;fill:#4b5563">1 : N</text>
  <text x="730" y="360" text-anchor="middle" style="font-size:15px;fill:#6b7280">Un género → muchos videojuegos</text>

  <!-- FK -->
  <rect x="330" y="552" width="800" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="356" y="580" style="font-size:16px;fill:#1f2a44;font-family:Consolas,monospace">FOREIGN KEY ("GeneroId") REFERENCES "Generos" ("Id") ON DELETE RESTRICT</text>
  <text x="356" y="602" style="font-size:14px;fill:#6b7280">La llave foránea vive en la tabla dependiente y garantiza que no exista un videojuego sin género válido</text>

  <text x="70" y="600" style="font-size:15px;fill:#6b7280">PK = llave primaria · FK = llave foránea · nav = propiedad de navegación</text>
</svg>
</body>
</html>
