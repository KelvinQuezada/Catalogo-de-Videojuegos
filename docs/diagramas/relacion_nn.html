<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  text { font-family: "Segoe UI", Arial, sans-serif; }
</style>
</head>
<body>
<svg width="1460" height="700" viewBox="0 0 1460 700" xmlns="http://www.w3.org/2000/svg">
  <rect width="1460" height="700" fill="#ffffff"/>

  <text x="730" y="46" text-anchor="middle" style="font-size:26px;font-weight:700;fill:#1f2a44">Relación muchos a muchos: Videojuego (N) ↔ Plataforma (N)</text>
  <text x="730" y="76" text-anchor="middle" style="font-size:17px;fill:#4b5563">EF Core crea una tabla intermedia con clave primaria compuesta por las dos llaves foráneas</text>

  <!-- VIDEOJUEGO -->
  <rect x="60" y="170" width="380" height="290" rx="14" fill="#eef2ff" stroke="#3446a8" stroke-width="2.5"/>
  <rect x="60" y="170" width="380" height="56" rx="14" fill="#3446a8"/>
  <rect x="60" y="206" width="380" height="20" fill="#3446a8"/>
  <text x="84" y="207" style="font-size:23px;font-weight:700;fill:#ffffff">Videojuego</text>

  <text x="86" y="266" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Id</text>
  <rect x="140" y="249" width="48" height="24" rx="4" fill="#ffe9a8"/>
  <text x="149" y="267" style="font-size:15px;fill:#7a5a00">PK</text>

  <text x="86" y="316" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Titulo</text>
  <text x="86" y="362" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Precio</text>
  <text x="86" y="408" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Plataformas</text>
  <rect x="246" y="390" width="62" height="24" rx="4" fill="#e6e9f5"/>
  <text x="256" y="408" style="font-size:15px;fill:#3b4a6b">nav</text>

  <!-- INTERMEDIA -->
  <rect x="560" y="180" width="340" height="270" rx="14" fill="#fff7e6" stroke="#c47f00" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="730" y="222" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#7a4d00">PlataformaVideojuego</text>
  <text x="730" y="248" text-anchor="middle" style="font-size:14px;fill:#8a6a1f">tabla intermedia generada por EF Core</text>

  <text x="586" y="292" style="font-size:18px;font-family:Consolas,monospace;fill:#1f2a44">PlataformasId</text>
  <rect x="742" y="276" width="48" height="24" rx="4" fill="#ffe9a8"/>
  <text x="751" y="294" style="font-size:15px;fill:#7a5a00">PK</text>
  <rect x="798" y="276" width="48" height="24" rx="4" fill="#d9f2e6"/>
  <text x="807" y="294" style="font-size:15px;fill:#14532d">FK</text>

  <text x="586" y="342" style="font-size:18px;font-family:Consolas,monospace;fill:#1f2a44">VideojuegosId</text>
  <rect x="742" y="326" width="48" height="24" rx="4" fill="#ffe9a8"/>
  <text x="751" y="344" style="font-size:15px;fill:#7a5a00">PK</text>
  <rect x="798" y="326" width="48" height="24" rx="4" fill="#d9f2e6"/>
  <text x="807" y="344" style="font-size:15px;fill:#14532d">FK</text>

  <text x="586" y="392" style="font-size:15px;fill:#6b7280">Sin columnas propias: solo la pareja</text>
  <text x="586" y="414" style="font-size:15px;fill:#6b7280">de identificadores que forma la relación</text>

  <!-- PLATAFORMA -->
  <rect x="1020" y="170" width="380" height="290" rx="14" fill="#f8fafc" stroke="#1f2a44" stroke-width="2.5"/>
  <rect x="1020" y="170" width="380" height="56" rx="14" fill="#1f2a44"/>
  <rect x="1020" y="206" width="380" height="20" fill="#1f2a44"/>
  <text x="1044" y="207" style="font-size:23px;font-weight:700;fill:#ffffff">Plataforma</text>

  <text x="1046" y="266" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Id</text>
  <rect x="1100" y="249" width="48" height="24" rx="4" fill="#ffe9a8"/>
  <text x="1109" y="267" style="font-size:15px;fill:#7a5a00">PK</text>

  <text x="1046" y="316" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Nombre</text>
  <text x="1046" y="362" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Fabricante</text>
  <text x="1046" y="408" style="font-size:20px;font-family:Consolas,monospace;fill:#1f2a44">Videojuegos</text>
  <rect x="1206" y="390" width="62" height="24" rx="4" fill="#e6e9f5"/>
  <text x="1216" y="408" style="font-size:15px;fill:#3b4a6b">nav</text>

  <!-- LINEAS -->
  <path d="M 440 315 L 560 315" stroke="#3446a8" stroke-width="3"/>
  <path d="M 900 315 L 1020 315" stroke="#1f2a44" stroke-width="3"/>
  <text x="470" y="298" style="font-size:30px;font-weight:700;fill:#3446a8">N</text>
  <text x="950" y="298" style="font-size:30px;font-weight:700;fill:#1f2a44">N</text>

  <!-- REGLAS -->
  <rect x="150" y="540" width="1160" height="120" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="176" y="572" style="font-size:16px;font-weight:600;fill:#1f2a44">Restricciones creadas por la migración</text>
  <text x="176" y="600" style="font-size:15px;fill:#374151;font-family:Consolas,monospace">PRIMARY KEY ("PlataformasId", "VideojuegosId")   → impide duplicar la misma pareja</text>
  <text x="176" y="624" style="font-size:15px;fill:#374151;font-family:Consolas,monospace">FOREIGN KEY ("PlataformasId") REFERENCES "Plataformas" ("Id") ON DELETE CASCADE</text>
  <text x="176" y="648" style="font-size:15px;fill:#374151;font-family:Consolas,monospace">FOREIGN KEY ("VideojuegosId") REFERENCES "Videojuegos" ("Id") ON DELETE CASCADE</text>
</svg>
</body>
</html>
