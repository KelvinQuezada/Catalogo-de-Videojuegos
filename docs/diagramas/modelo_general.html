<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  svg { display: block; }
  text { font-family: "Segoe UI", Arial, sans-serif; }
  .titulo { font-size: 26px; font-weight: 700; fill: #1f2a44; }
  .campo { font-size: 19px; fill: #26314d; font-family: Consolas, "Courier New", monospace; }
  .rol { font-size: 16px; fill: #6b7280; font-family: "Segoe UI", Arial, sans-serif; }
  .card { fill: #ffffff; stroke: #3446a8; stroke-width: 2.5; rx: 12; }
  .card-principal { fill: #eef2ff; }
  .card-intermedia { fill: #fff7e6; stroke: #c47f00; stroke-dasharray: 7 5; }
  .etiqueta { font-size: 22px; font-weight: 700; fill: #3446a8; }
  .flecha { stroke: #3446a8; stroke-width: 2.5; fill: none; }
  .nota { font-size: 17px; fill: #4b5563; }
  .pk { fill: #ffe9a8; }
  .fk { fill: #d9f2e6; }
  .nav { fill: #e6e9f5; }
</style>
</head>
<body>
<svg width="1540" height="850" viewBox="0 0 1540 850" xmlns="http://www.w3.org/2000/svg">
  <rect width="1540" height="850" fill="#ffffff"/>

  <text x="770" y="46" text-anchor="middle" class="titulo">Modelo de datos del catálogo de videojuegos</text>
  <text x="770" y="76" text-anchor="middle" class="nota">Cuatro entidades: dos relaciones uno a muchos (1:N) y una relación muchos a muchos (N:N)</text>

  <!-- ================= GENERO ================= -->
  <rect x="60" y="120" width="340" height="230" rx="12" class="card"/>
  <rect x="60" y="120" width="340" height="46" rx="12" fill="#3446a8"/>
  <rect x="60" y="150" width="340" height="16" fill="#3446a8"/>
  <text x="80" y="151" class="titulo" fill="#ffffff" style="font-size:22px">Género</text>
  <text x="80" y="200" class="campo">Id</text>
  <rect x="150" y="184" width="46" height="22" rx="4" class="pk"/>
  <text x="158" y="201" class="rol" style="font-size:15px">PK</text>
  <text x="80" y="232" class="campo">Nombre</text>
  <text x="80" y="264" class="campo">Descripcion</text>
  <text x="80" y="296" class="campo">Popular</text>
  <text x="80" y="328" class="campo">Videojuegos</text>
  <rect x="238" y="312" width="58" height="22" rx="4" class="nav"/>
  <text x="246" y="329" class="rol" style="font-size:15px">nav</text>

  <!-- ================= DESARROLLADORA ================= -->
  <rect x="60" y="520" width="340" height="260" rx="12" class="card"/>
  <rect x="60" y="520" width="340" height="46" rx="12" fill="#3446a8"/>
  <rect x="60" y="550" width="340" height="16" fill="#3446a8"/>
  <text x="80" y="551" class="titulo" fill="#ffffff" style="font-size:22px">Desarrolladora</text>
  <text x="80" y="600" class="campo">Id</text>
  <rect x="150" y="584" width="46" height="22" rx="4" class="pk"/>
  <text x="158" y="601" class="rol" style="font-size:15px">PK</text>
  <text x="80" y="632" class="campo">Nombre</text>
  <text x="80" y="664" class="campo">Pais</text>
  <text x="80" y="696" class="campo">Fundacion</text>
  <text x="80" y="728" class="campo">Empleados</text>
  <text x="80" y="760" class="campo">Videojuegos</text>
  <rect x="238" y="744" width="58" height="22" rx="4" class="nav"/>
  <text x="246" y="761" class="rol" style="font-size:15px">nav</text>

  <!-- ================= VIDEOJUEGO ================= -->
  <rect x="560" y="210" width="380" height="420" rx="12" class="card card-principal"/>
  <rect x="560" y="210" width="380" height="46" rx="12" fill="#1f2a44"/>
  <rect x="560" y="240" width="380" height="16" fill="#1f2a44"/>
  <text x="580" y="241" class="titulo" fill="#ffffff" style="font-size:22px">Videojuego</text>
  <text x="580" y="290" class="campo">Id</text>
  <rect x="650" y="274" width="46" height="22" rx="4" class="pk"/>
  <text x="658" y="291" class="rol" style="font-size:15px">PK</text>
  <text x="580" y="322" class="campo">Titulo</text>
  <text x="580" y="354" class="campo">Precio</text>
  <text x="580" y="386" class="campo">FechaLanzamiento</text>
  <text x="580" y="418" class="campo">FechaRegistro</text>
  <text x="580" y="450" class="campo">Disponible</text>
  <text x="580" y="482" class="campo">Multijugador</text>
  <text x="580" y="514" class="campo">GeneroId</text>
  <rect x="726" y="498" width="46" height="22" rx="4" class="fk"/>
  <text x="734" y="515" class="rol" style="font-size:15px">FK</text>
  <text x="580" y="546" class="campo">Genero</text>
  <rect x="726" y="530" width="58" height="22" rx="4" class="nav"/>
  <text x="734" y="547" class="rol" style="font-size:15px">nav</text>
  <text x="580" y="578" class="campo">DesarrolladoraId</text>
  <rect x="798" y="562" width="46" height="22" rx="4" class="fk"/>
  <text x="806" y="579" class="rol" style="font-size:15px">FK</text>
  <text x="580" y="610" class="campo">Plataformas</text>
  <rect x="714" y="594" width="58" height="22" rx="4" class="nav"/>
  <text x="722" y="611" class="rol" style="font-size:15px">nav</text>

  <!-- ================= PLATAFORMA ================= -->
  <rect x="1130" y="210" width="350" height="340" rx="12" class="card"/>
  <rect x="1130" y="210" width="350" height="46" rx="12" fill="#3446a8"/>
  <rect x="1130" y="240" width="350" height="16" fill="#3446a8"/>
  <text x="1150" y="241" class="titulo" fill="#ffffff" style="font-size:22px">Plataforma</text>
  <text x="1150" y="290" class="campo">Id</text>
  <rect x="1220" y="274" width="46" height="22" rx="4" class="pk"/>
  <text x="1228" y="291" class="rol" style="font-size:15px">PK</text>
  <text x="1150" y="322" class="campo">Nombre</text>
  <text x="1150" y="354" class="campo">Fabricante</text>
  <text x="1150" y="386" class="campo">Generacion</text>
  <text x="1150" y="418" class="campo">PrecioBase</text>
  <text x="1150" y="450" class="campo">Activa</text>
  <text x="1150" y="482" class="campo">Videojuegos</text>
  <rect x="1308" y="466" width="58" height="22" rx="4" class="nav"/>
  <text x="1316" y="483" class="rol" style="font-size:15px">nav</text>

  <!-- ============ 1:N Genero -> Videojuego ============ -->
  <path d="M 400 235 C 480 235, 480 330, 560 330" class="flecha"/>
  <text x="430" y="222" class="etiqueta">1</text>
  <text x="522" y="322" class="etiqueta">N</text>
  <text x="404" y="290" class="rol" style="font-size:16px">agrupa</text>

  <!-- ============ 1:N Desarrolladora -> Videojuego ============ -->
  <path d="M 400 650 C 480 650, 480 510, 560 510" class="flecha"/>
  <text x="430" y="670" class="etiqueta">1</text>
  <text x="522" y="502" class="etiqueta">N</text>
  <text x="404" y="612" class="rol" style="font-size:16px">produce</text>

  <!-- ============ N:N Videojuego <-> Plataforma ============ -->
  <path d="M 940 420 L 985 420" class="flecha"/>
  <path d="M 1105 420 L 1130 420" class="flecha"/>
  <text x="946" y="406" class="etiqueta">N</text>
  <text x="1112" y="406" class="etiqueta">N</text>

  <rect x="985" y="345" width="120" height="150" rx="10" class="card card-intermedia"/>
  <text x="1045" y="372" text-anchor="middle" class="campo" style="font-size:15px">Plataforma</text>
  <text x="1045" y="392" text-anchor="middle" class="campo" style="font-size:15px">Videojuego</text>
  <text x="1045" y="424" text-anchor="middle" class="campo" style="font-size:14px">PlataformasId</text>
  <text x="1045" y="444" text-anchor="middle" class="campo" style="font-size:14px">VideojuegosId</text>
  <text x="1045" y="474" text-anchor="middle" class="rol" style="font-size:13px">PK compuesta</text>

  <!-- leyenda -->
  <rect x="60" y="800" width="46" height="20" rx="4" class="pk"/>
  <text x="114" y="815" class="nota">Llave primaria</text>
  <rect x="260" y="800" width="46" height="20" rx="4" class="fk"/>
  <text x="314" y="815" class="nota">Llave foránea</text>
  <rect x="450" y="800" width="46" height="20" rx="4" class="nav"/>
  <text x="504" y="815" class="nota">Propiedad de navegación</text>
  <text x="790" y="815" class="nota">La tabla intermedia la genera EF Core: no se escribe en el modelo.</text>
</svg>
</body>
</html>
